name: Actualizacion Automatica de Datos
on:
  schedule:
    # 20:30 UTC = 17:30 ART. IDECBA publica alrededor de las 16hs (IPCBA, canastas,
    # ejes comerciales), asi que a las 17:30 el dato del dia ya esta arriba.
    # Antes corria 13:00 UTC (10:00 ART) y perdia las publicaciones del propio dia:
    # el IPCBA de julio 2026 salio el 07/08 y el tablero quedo mostrando junio.
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar librerias
        run: pip install requests openpyxl beautifulsoup4 lxml xlrd

      - name: Crear carpeta idecba
        run: mkdir -p idecba

      - name: Bajar XLSX de IDECBA
        run: python descargar_datos.py

      - name: Generar macro_data.json
        run: python build_macro_data.py

      - name: Generar calendario.json + inyectar calData en HTML
        run: python build_calendario.py

      - name: PGB sectorial + IPCBA rubros + parche MACRO inline en HTML
        run: python build_pgb_rubros.py

      - name: Commit y push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M')"
          git push
